name: Document Engine Child Call Diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["codex/desktop-next"]
    paths: [".github/workflows/document-child-call.yml"]

permissions:
  contents: read

concurrency:
  group: document-child-call-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    if: github.ref == 'refs/heads/codex/desktop-next'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false
      - name: Install locked preparation dependencies
        run: pnpm install --frozen-lockfile
        shell: pwsh
      - name: Prepare production runtime and SDK
        run: pnpm assistant:prepare
        shell: pwsh
      - name: Verify production runtime closure
        run: pnpm assistant:smoke
        shell: pwsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Restore development debug0 Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Cargo.toml also binds features and profile settings. Keep this
          # development cache separate while reusing completed v2 dependencies.
          key: document-engine-development-windows-cargo-debug0-v3-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            document-engine-development-windows-cargo-debug0-v3-
            windows-cargo-debug0-v2-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
            windows-cargo-debug0-v2-
      - name: Create frontend dist placeholder
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
        shell: pwsh
      - name: Observe the fixed child request on the production LPAC token
        run: .\assistant-runtime\resources\node\node.exe scripts/document-engine-development-check.mjs --out "$env:RUNNER_TEMP/document-child-call-$env:GITHUB_RUN_ATTEMPT"
        shell: pwsh
        env:
          OFOX_DOCUMENT_CHILD_CALL_TRACE: "1"
      - name: Upload the closed diagnostic result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: document-child-call-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/document-child-call-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/document-child-call-${{ github.run_attempt }}/child-call-trace.log
          retention-days: 14
          if-no-files-found: warn
