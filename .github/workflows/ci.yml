name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The release workflow calls this one to verify the commit it is about to build.
  workflow_call:

# A pull request supersedes its earlier runs; main keeps a verdict per SHA.
# Release branches run these same complete checks through Branch Packages, so a
# single push does not queue two identical CI suites behind this concurrency key.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Install isolated assistant dependencies
        run: pnpm assistant:install

      # Match Windows Probe's pinned test-only font on the English Linux image.
      - name: Prepare pinned CJK thumbnail test font
        shell: bash
        run: |
          set -euo pipefail
          cjk_font="$RUNNER_TEMP/OfoxTestCJK.otf"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' --output "$cjk_font"
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $cjk_font" | sha256sum --check
          echo "OFOX_TEST_CJK_FONT=$cjk_font" >> "$GITHUB_ENV"

      - name: Assistant SDK and security tests
        run: pnpm assistant:test

  backend:
    name: Backend Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for bundled assistant resources
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"

      - name: Prepare production assistant resources before Cargo
        run: |
          node scripts/assistant-prepare.mjs
          node scripts/assistant-smoke.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  backend-macos:
    name: Backend Checks (macOS)
    # macOS 14 runners retire on 2026-11-02; macos-15 retains Apple Silicon.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for bundled assistant verification
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"

      - name: Setup pnpm for presentation maintenance tests
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false

      - name: Install presentation maintenance test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and test isolated assistant runtime
        run: |
          node scripts/assistant-prepare.mjs --install-only
          node scripts/assistant-test.mjs
          node scripts/assistant-prepare.mjs
          node scripts/assistant-smoke.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
