name: Assistant Windows Execute Probe
on:
  push:
    branches: ["feat/assistant-*"]
  workflow_dispatch:
jobs:
  execute-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise production executor from PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: cargo run --manifest-path scripts/tests/assistant-execute-probe/Cargo.toml --locked
      - name: Exercise production executor from Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: cargo run --manifest-path scripts/tests/assistant-execute-probe/Cargo.toml --locked
