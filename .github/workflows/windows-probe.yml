name: Windows Probe

# 目的：给 Windows 验收链路一个"零环境成本"的产物入口。
#
# 主 CI（ci.yml）只在 pull_request→main 上跑，且 backend job 用 ubuntu-22.04
# 跑 clippy，捕不到 Windows target 特有的 unused_imports / cfg mismatch 等
# 问题。本 workflow 补两件事：
#   1. Windows target 的完整 Rust 测试、fmt、all-targets clippy
#   2. 安装状态只读探针和 ChatGPT 安装探针产物 —— reviewer 可以直接
#      下载去干净 Windows 环境验收，不用现装 Rust/MSVC/Node
#
# 触发器故意宽——feat/chatgpt-* 分支上每次 push 都跑，避免"改了 Windows
# 分支代码但没跑 Windows CI，问题拖到最后 rebase"。也支持 workflow_dispatch
# 手动重跑。
on:
  push:
    branches:
      - main
      - "feat/chatgpt-**"
      - "feat/*windows*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-probe:
    name: Windows lifecycle tests + probes
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 显式声明 MSVC target——runner 默认就是它，这里写清楚免得 install-target
          # 步骤被跳过时找不到 std。
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # windows-2022 与 ubuntu 缓存分开——windows 的 target/ 目录里是 .pdb/.lib
          # 与 linux 完全不兼容，共享 cache key 会互相 invalidate。
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      # tauri-build 会检查 frontend dist 是否存在（就算这里只 build lib+bins 不装 WebView2
      # 也过一遍 build script）。给个空 dist 占位，与 ci.yml backend job 保持一致。
      - name: Create frontend dist placeholder
        run: mkdir dist -Force
        shell: pwsh

      - name: Build Windows probes
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin verify_chatgpt_install --bin verify_tool_lifecycle

      - name: Upload probe artifact
        uses: actions/upload-artifact@v6
        with:
          name: verify_chatgpt_install-${{ github.sha }}
          path: src-tauri/target/release/verify_chatgpt_install.exe
          # 90 天足够 review + 手工验收周期用；超过就重跑 workflow 即可。
          retention-days: 90
          if-no-files-found: error

      - name: Upload read-only lifecycle probe
        uses: actions/upload-artifact@v6
        with:
          name: verify_tool_lifecycle-${{ github.sha }}
          path: src-tauri/target/release/verify_tool_lifecycle.exe
          retention-days: 90
          if-no-files-found: error

      # Exercise the release upload/download pair and its separate artifact directories.
      - name: Download probes with release artifact action
        uses: actions/download-artifact@v8
        with:
          pattern: verify_*-${{ github.sha }}
          path: ${{ runner.temp }}/probe-artifact-roundtrip

      - name: Verify downloaded probe artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $roundtripRoot = Join-Path $env:RUNNER_TEMP "probe-artifact-roundtrip"
          $downloadedDirectories = @(Get-ChildItem -LiteralPath $roundtripRoot -Directory)
          if ($downloadedDirectories.Count -ne 2) {
            throw "Expected two separate probe artifact directories"
          }
          foreach ($probe in @("verify_chatgpt_install", "verify_tool_lifecycle")) {
            $source = Join-Path "src-tauri/target/release" "$probe.exe"
            $artifactDirectory = Join-Path $roundtripRoot "$probe-$env:GITHUB_SHA"
            $downloaded = Join-Path $artifactDirectory "$probe.exe"
            $expectedHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $downloadedHash = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash
            if ($downloadedHash -ne $expectedHash) {
              throw "Downloaded $probe artifact does not match the compiled probe"
            }
            Write-Host "Verified $probe artifact directory and SHA-256"
          }

      # Compile and run all tests, including Windows file-lock/cmd fixtures.
      # Use Windows PowerShell 5.1, the same entry point as a fresh test host.
      - name: Windows lifecycle checks
        run: .\scripts\test-windows.ps1 -BackendOnly -OutputDirectory artifacts/windows-tests/ci
        shell: powershell

      - name: Upload Windows verification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-results-${{ github.sha }}
          path: artifacts/windows-tests/ci/
          retention-days: 30
          if-no-files-found: warn
