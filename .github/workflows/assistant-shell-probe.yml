name: Assistant Windows Shell Probe
on:
  push:
    branches: ["feat/assistant-*"]
  workflow_dispatch:
jobs:
  shell-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inspect filtered PowerShell and owned Job completion
        run: cargo run --manifest-path scripts/tests/assistant-process-probe/Cargo.toml --locked
