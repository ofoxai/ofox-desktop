name: Release

# 发版流程：打 tag → 构建 → 签名/公证 → 上传 R2 → 更新 latest.json
#
# 安全模型（公开仓库）：
#   1. 只由 tag push 触发。fork 无法向本仓库推 tag，因此拿不到任何 secret。
#   2. 绝不使用 pull_request_target —— 那会在 fork PR 上注入 secret。
#   3. 所有凭据放在 `release` environment，仅声明了该 environment 的 job 可见；
#      environment 另配 tag 部署策略（只允许 *_*_* 形态），仓库转 public 后
#      再补 required reviewers 审批门。
#   4. 不 echo / 不 base64 变换后打印任何 secret —— 自动打码只对字面值生效。
#
# 平台：macOS（签名 + 公证的 DMG）与 Windows（暂不签名的 NSIS 安装包）。扩展 Linux：
# 在 build 的 matrix 里取消对应注释块，并补「打包产物 → 重命名」步骤。publish job
# 无需改动（它按 artifact 目录遍历）。任一平台构建失败都会阻止本次发布，打 tag 前
# 先用 workflow_dispatch（dry_run）跑一遍。

on:
  push:
    tags:
      # 对齐发版 tag 约定：<version>_YYYYMMDD_HHMM，例如 1.3.2_20260917_1230
      - "[0-9]+.[0-9]+.[0-9]+_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9]"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不上传 R2（用于验证流水线）"
        type: boolean
        default: true

# 最小默认权限；需要提权的 job 自行声明
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false # 发版过程不中断

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.12.3"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 构建：按平台 fan out，产物以 artifact 形式交给 publish
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    environment: release # ← secrets 边界
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-14
            r2_prefix: release/mac/arm
            ext: dmg
          # Windows：暂不签名的 NSIS 安装包（按用户安装，签名等证书到位后再加）
          - platform: windows-x86_64
            os: windows-2022
            r2_prefix: release/windows/x64
            ext: exe
          # ── 预留：Linux ────────────────────────────────────
          # - platform: linux-x86_64
          #   os: ubuntu-22.04
          #   r2_prefix: release/linux/x64
          #   ext: AppImage
    runs-on: ${{ matrix.os }}
    # 构建只签名并提交公证，不在这里等结果（见 Publish）。
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号是发版的唯一真相来源：三处必须一致，且 tag 前缀要对得上。
      # 打错 tag 是最容易犯的错，这里直接失败比发出错版本强。
      - name: Verify version consistency
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VER_PKG=$(node -p "require('./package.json').version")
          VER_TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          VER_CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          if [[ "$VER_PKG" != "$VER_TAURI" || "$VER_PKG" != "$VER_CARGO" ]]; then
            echo "❌ 版本号不一致：" >&2
            echo "   package.json    = $VER_PKG" >&2
            echo "   tauri.conf.json = $VER_TAURI" >&2
            echo "   Cargo.toml      = $VER_CARGO" >&2
            exit 1
          fi

          # tag 触发时校验 tag 前缀 == 版本号（<version>_YYYYMMDD_HHMM）
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VER="${GITHUB_REF_NAME%%_*}"
            if [[ "$TAG_VER" != "$VER_PKG" ]]; then
              echo "❌ tag 版本号 ($TAG_VER) 与项目版本号 ($VER_PKG) 不符" >&2
              echo "   tag = $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi

          echo "version=$VER_PKG" >> "$GITHUB_OUTPUT"
          echo "✅ 版本号一致: $VER_PKG"

      # ── macOS：先确认能公证 ──────────────────────────────────
      # 公证失败要等十几分钟的构建跑完才暴露，构建还会重试 3 轮。Apple 账号协议
      # 过期（HTTP 403 "A required agreement is missing or has expired"）或 app
      # 专用密码失效时，这里几秒内就停下并说明原因。
      - name: Check notarization access (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          if OUTPUT=$(xcrun notarytool history --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1); then
            echo "✅ 公证凭据可用"
            exit 0
          fi
          echo "$OUTPUT" >&2
          if echo "$OUTPUT" | grep -q "required agreement"; then
            echo "::error title=Apple 开发者协议未签署::请 Apple 开发者账号持有人登录 https://developer.apple.com/account 接受更新后的协议，再重跑本次发版。"
          else
            echo "::error title=公证凭据不可用::请检查 release environment 里的 APPLE_ID、APPLE_PASSWORD（app 专用密码）和 APPLE_TEAM_ID。"
          fi
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── macOS：证书导入 ──────────────────────────────────────
      # 建临时 keychain 而非污染 runner 默认 keychain；always() 那步会清理。
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 加进搜索列表而非替换默认 keychain，降低对 runner 环境的侵入
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 无此步 codesign 会弹交互授权框，CI 上表现为卡死
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ 未找到 Developer ID Application 身份" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "✅ 签名身份: $IDENTITY"

          rm -f "$CERT_PATH"

      # ── macOS：构建（Tauri 内部完成 codesign + 公证 + staple .app）──
      # 只签名，不在这里公证：Apple 处理新团队的提交可能要几个小时，超过单个
      # 任务的时限（1.3.4 两次都因此超时）。公证在下面提交、在 Publish 里等。
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # 公证服务偶发超时/限流，重试而非直接失败
          for attempt in 1 2 3; do
            echo "=== 构建尝试 $attempt/3 ==="
            if pnpm tauri build; then
              echo "✅ 构建成功"
              exit 0
            fi
            [ "$attempt" -eq 3 ] && { echo "❌ 构建失败（已重试 3 次）" >&2; exit 1; }
            echo "⚠️ 失败，${attempt}0 秒后重试..."
            sleep "${attempt}0"
          done

      # ── macOS：提交 DMG 公证，不等结果 ────────────────────────
      # 公证最外层的 DMG 会把里面的 App 一并登记：DMG 钉上凭证；用户第一次打开
      # 拖出来的 App 时，macOS 联网就能查到它的凭证。结果在 Publish 里等，那里
      # 超时了可以单独重跑，不用重新构建、重新排队。
      - name: Submit DMG for notarization (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -name "*${VERSION}*" | head -1)
          [ -z "$DMG" ] && { echo "❌ 找不到 v${VERSION} 的 dmg 产物" >&2; exit 1; }
          echo "dmg: $DMG"
          # 归一化文件名：Ofox Desktop_1.3.2_aarch64.dmg → ofox_desktop_1.3.2.dmg。
          # 提交的就是要上传的这一份，Publish 给它钉凭证时内容不变。
          mkdir -p dist-release notary
          OUT="dist-release/ofox_desktop_${VERSION}.dmg"
          cp "$DMG" "$OUT"
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          json_field() { python3 -c "import json,sys; print(json.load(sys.stdin).get('$1') or '')"; }
          ID=""
          for attempt in 1 2 3; do
            echo "=== 提交公证 $attempt/3 ==="
            if ID=$(xcrun notarytool submit "$OUT" "${AUTH[@]}" --output-format json | json_field id) && [ -n "$ID" ]; then
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "❌ 提交公证失败（已重试 3 次）" >&2; exit 1; }
            sleep $((attempt * 30))
          done
          echo "$ID" > notary/submission-id
          echo "✅ 已提交公证: ${ID}（在 Publish 里等结果）"

      - name: Upload notarization submission (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: notary-${{ matrix.platform }}
          path: notary/submission-id
          if-no-files-found: error
          retention-days: 30

      # ── Windows：构建（暂不签名）──────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 60
        run: pnpm tauri build --bundles nsis

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # cargo 缓存会带回旧版本的安装包：只认本次版本号，且必须唯一
          mapfile -t found < <(find src-tauri/target -path "*/release/bundle/nsis/*_${VERSION}_*-setup.exe")
          if [ "${#found[@]}" -ne 1 ]; then
            echo "❌ 期望 1 个 v${VERSION} 的 NSIS 安装包，实际 ${#found[@]} 个：${found[*]:-无}" >&2
            exit 1
          fi
          mkdir -p dist-release
          cp "${found[0]}" "dist-release/ofox_desktop_${VERSION}.exe"

      # ── 预留：Linux 打包 ─────────────────────────────────────
      # - name: Prepare artifact (Linux)
      #   if: runner.os == 'Linux'
      #   shell: bash
      #   env:
      #     VERSION: ${{ steps.version.outputs.version }}
      #   run: |
      #     set -euo pipefail
      #     mkdir -p dist-release
      #     APPIMAGE=$(find src-tauri/target -name "*.AppImage" | head -1)
      #     cp "$APPIMAGE" "dist-release/ofox_desktop_${VERSION}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Clean up keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

  # ─────────────────────────────────────────────────────────────
  # 发布：汇总各平台产物 → 上传 R2 → 合并更新 latest.json
  # ─────────────────────────────────────────────────────────────
  publish:
    name: Publish to R2
    needs: build
    environment: release
    # 要等公证结果并给 DMG 钉凭证（xcrun），所以在 macOS 上跑。Apple 慢时在这里
    # 等；真超时了就在 Actions 页面重跑这个任务，构建产物和公证提交都还在。
    runs-on: macos-14
    timeout-minutes: 350
    # dry_run 时跳过（workflow_dispatch 默认 dry_run=true）
    if: github.event_name == 'push' || inputs.dry_run == false

    env:
      BUCKET: ofox-desktop-releases
      BASE_URL: https://desktop.ofox.ai
      DOWNLOAD_PAGE: https://ofox.ai/download
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: artifacts

      - name: Download notarization submissions
        uses: actions/download-artifact@v8
        with:
          pattern: notary-*
          path: notary

      - name: Wait for notarization and staple (macOS)
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="artifacts/build-darwin-aarch64/ofox_desktop_${VERSION}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "▶ 本次没有 macOS 产物，跳过"
            exit 0
          fi
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          json_field() { python3 -c "import json,sys; print(json.load(sys.stdin).get('$1') or '')"; }
          if xcrun stapler validate "$DMG" >/dev/null 2>&1; then
            echo "▶ 已 staple"
          else
            ID=$(cat notary/notary-darwin-aarch64/submission-id)
            echo "submission: $ID"
            # 留出上传和清理的时间：约 5 小时后还没结果就停下，提示重跑本任务。
            DEADLINE=$((SECONDS + 300 * 60))
            while true; do
              STATUS=$(xcrun notarytool info "$ID" "${AUTH[@]}" --output-format json 2>/dev/null | json_field status || true)
              echo "[$(date -u +%H:%M:%S)] 公证状态: ${STATUS:-（查询失败，稍后重试）}"
              case "$STATUS" in
                Accepted) break ;;
                Invalid|Rejected)
                  xcrun notarytool log "$ID" "${AUTH[@]}" || true
                  echo "❌ 公证未通过: $STATUS" >&2
                  exit 1 ;;
              esac
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::error title=公证仍在处理中::Apple 还没处理完提交 ${ID}。稍后在本页面对「Publish to R2」点 Re-run，会继续等同一个提交，不用重新构建。"
                exit 1
              fi
              xcrun notarytool wait "$ID" "${AUTH[@]}" --timeout 30m >/dev/null 2>&1 || true
            done
            xcrun stapler staple "$DMG"
            echo "✅ 公证通过并已 staple"
          fi
          echo "▶ Gatekeeper 验证"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"
          echo "✅ 验证通过"

      - name: Configure R2 credentials
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null || brew install awscli
          mkdir -p ~/.aws
          # 写文件而非 export，避免出现在进程列表 / 子进程环境里
          {
            echo "[default]"
            echo "aws_access_key_id=${R2_ACCESS_KEY_ID}"
            echo "aws_secret_access_key=${R2_SECRET_ACCESS_KEY}"
          } > ~/.aws/credentials
          chmod 600 ~/.aws/credentials

      - name: Upload installers to R2
        shell: bash
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          # platform → R2 前缀、扩展名 → content-type。新增平台时在这里加一行。
          # 用 case 而非关联数组：本任务跑在 macOS 上，系统 bash 是 3.2。
          prefix_for() {
            case "$1" in
              darwin-aarch64) echo "release/mac/arm" ;;
              windows-x86_64) echo "release/windows/x64" ;;
              linux-x86_64) echo "release/linux/x64" ;;
            esac
          }
          ctype_for() {
            case "$1" in
              dmg) echo "application/x-apple-diskimage" ;;
              msi) echo "application/x-msi" ;;
              exe) echo "application/vnd.microsoft.portable-executable" ;;
              AppImage) echo "application/x-executable" ;;
              *) echo "application/octet-stream" ;;
            esac
          }

          for dir in artifacts/build-*; do
            [ -d "$dir" ] || continue
            platform="${dir#artifacts/build-}"
            prefix="$(prefix_for "$platform")"
            [ -z "$prefix" ] && { echo "❌ 未知平台 ${platform}，缺少 R2 前缀映射" >&2; exit 1; }

            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              fname=$(basename "$file")
              ext="${fname##*.}"
              ctype="$(ctype_for "$ext")"

              echo "▶ ${fname} → r2://${BUCKET}/${prefix}/${fname}"
              aws s3 cp "$file" "s3://${BUCKET}/${prefix}/${fname}" \
                --endpoint-url "$ENDPOINT" \
                --content-type "$ctype" \
                --only-show-errors
            done
          done
          echo "✅ 安装包上传完成"

      # latest.json 必须「合并」而非「覆盖」：各平台可能在不同时间独立发版，
      # 直接覆盖会抹掉其他平台的 downloads key。
      - name: Update latest.json
        shell: bash
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 拉现有清单；不存在则从空对象起步
          if aws s3 cp "s3://${BUCKET}/latest.json" old.json \
               --endpoint-url "$ENDPOINT" --only-show-errors 2>/dev/null; then
            echo "▶ 已拉取现有 latest.json"
          else
            echo '{}' > old.json
            echo "▶ 无现有 latest.json，新建"
          fi

          # 本次构建覆盖了哪些平台
          PLATFORMS=""
          for dir in artifacts/build-*; do
            [ -d "$dir" ] || continue
            PLATFORMS="${PLATFORMS} ${dir#artifacts/build-}"
          done

          VERSION="$VERSION" BASE_URL="$BASE_URL" DOWNLOAD_PAGE="$DOWNLOAD_PAGE" \
          PLATFORMS="$PLATFORMS" node <<'NODE' > latest.json
          const fs = require('fs');
          const old = JSON.parse(fs.readFileSync('old.json', 'utf8'));
          const { VERSION, BASE_URL, DOWNLOAD_PAGE, PLATFORMS } = process.env;

          const PREFIX = {
            'darwin-aarch64': 'release/mac/arm',
            'windows-x86_64': 'release/windows/x64',
            'linux-x86_64':   'release/linux/x64',
          };
          const EXT = {
            'darwin-aarch64': 'dmg',
            'windows-x86_64': 'exe',
            'linux-x86_64':   'AppImage',
          };

          // 保留其他平台既有条目，只更新本次构建的平台
          const downloads = { ...(old.downloads || {}) };
          for (const p of PLATFORMS.trim().split(/\s+/).filter(Boolean)) {
            downloads[p] = `${BASE_URL}/${PREFIX[p]}/ofox_desktop_${VERSION}.${EXT[p]}`;
          }

          console.log(JSON.stringify({
            version: VERSION,
            pubDate: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            notes: old.notes ?? "",   // 默认留空，避免撑爆检查更新 toast
            downloads,
            downloadPage: DOWNLOAD_PAGE,
          }, null, 2));
          NODE

          echo "▶ 新 latest.json:"
          cat latest.json

          aws s3 cp latest.json "s3://${BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0" \
            --only-show-errors
          echo "✅ 清单已更新"

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "▶ 拉取 ${BASE_URL}/latest.json"
          # CDN 可能有短暂缓存，重试几次
          for i in 1 2 3 4 5; do
            PUBLISHED=$(curl -fsSL "${BASE_URL}/latest.json" || echo '{}')
            GOT=$(echo "$PUBLISHED" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version || ''" 2>/dev/null || echo "")
            if [ "$GOT" = "$VERSION" ]; then
              echo "$PUBLISHED"
              echo "✅ 线上清单版本 = $VERSION"
              exit 0
            fi
            echo "⏳ 线上仍为 '${GOT}'，等待 CDN 刷新 (${i}/5)..."
            sleep 10
          done
          echo "⚠️ 线上清单未在预期时间内更新到 $VERSION —— 可能是 CDN 缓存，请手动核对" >&2
          # 上传已成功，缓存滞后不应判定发版失败
          exit 0

      - name: Clean up credentials
        if: always()
        shell: bash
        run: rm -f ~/.aws/credentials

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ✅ 发版完成 v${VERSION}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 清单 | ${BASE_URL}/latest.json |"
            for dir in artifacts/build-*; do
              [ -d "$dir" ] || continue
              for f in "$dir"/*; do
                [ -f "$f" ] && echo "| 产物 | \`$(basename "$f")\` |"
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
