name: Document Engine Development Checks

# Separate developer diagnostics, never Windows Probe or release evidence.
on:
  workflow_dispatch:
  # Register this new workflow without changing main. Only edits to this file
  # on this one development branch bootstrap a run; source changes stay manual.
  push:
    branches: ["codex/desktop-next"]
    paths: [".github/workflows/document-engine-check.yml"]

permissions:
  contents: read

concurrency:
  group: document-engine-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-engine-development:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false
      - name: Install locked preparation dependencies
        run: pnpm install --frozen-lockfile
        shell: pwsh
      - name: Prepare production runtime and SDK
        run: pnpm assistant:prepare
        shell: pwsh
      - name: Verify production runtime closure
        run: pnpm assistant:smoke
        shell: pwsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Restore development debug0 Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Cargo.toml also binds features and profile settings. Keep this
          # development cache separate while reusing completed v2 dependencies.
          key: document-engine-development-windows-cargo-debug0-v3-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            document-engine-development-windows-cargo-debug0-v3-
            windows-cargo-debug0-v2-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
            windows-cargo-debug0-v2-
      - name: Create frontend dist placeholder
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
        shell: pwsh
      - name: Verify control reader stays responsive before native probes
        run: .\assistant-runtime\resources\node\node.exe scripts/check-document-control.mjs
        shell: pwsh
      # The runner's first Cargo command is the exact synthetic ACL test. A
      # failure stops immediately; subsequent fixed filters must run >0 tests.
      - name: ACL prerequisite then focused native regressions
        run: .\assistant-runtime\resources\node\node.exe scripts/document-engine-development-check.mjs --out "$env:RUNNER_TEMP/document-engine-development-$env:GITHUB_RUN_ATTEMPT"
        shell: pwsh
      - name: Upload development diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: document-engine-development-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/document-engine-development-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve completed development dependencies after failure
        if: ${{ always() && !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
