<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">One assistant. More ways to create.</title><desc id="desc">Original animated capability illustration: image, video and speech generation. These are conceptual symbols, not generated media results or application UI. Availability depends on the selected model and account.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#10131b"/><stop offset="1" stop-color="#151924"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#eef1f7}
.muted{fill:#a5aec0}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:650;fill:#ffb684}
.wave{transform-box:fill-box;transform-origin:center;animation:voice 1.8s ease-in-out infinite}
.timeline{stroke-dasharray:198;animation:play 4s ease-in-out infinite}
.sun{animation:glow 4s ease-in-out infinite}.sweep{animation:scan 4s ease-in-out infinite}
@keyframes voice{0%,100%{transform:scaleY(.45);opacity:.55}50%{transform:scaleY(1);opacity:1}}
@keyframes play{0%{stroke-dashoffset:198}80%,100%{stroke-dashoffset:0}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:0}20%,80%{opacity:.8}90%{transform:translateY(128px);opacity:0}}
@media(prefers-reduced-motion:reduce){.wave,.timeline,.sun,.sweep{animation:none}}
</style>
<rect width="1200" height="460" rx="24" fill="url(#canvas)"/>
<rect x=".5" y=".5" width="1199" height="459" rx="23.5" fill="none" stroke="#343b4d"/>
<text x="38" y="40" class="eyebrow">CREATE WITH OFOX ASSISTANT</text>
<text x="38" y="83" font-size="32" font-weight="650" letter-spacing="-.5">One assistant. More ways to create.</text>
<rect x="38" y="116" width="364" height="288" rx="20" fill="#1a1f2c" stroke="#343b4d"/>
<text x="62" y="149" class="eyebrow">IMAGE</text>
<text x="62" y="346" font-size="23" font-weight="620">Describe a visual</text>
<text x="62" y="377" class="muted" font-size="16">From an idea to an image</text><rect x="418" y="116" width="364" height="288" rx="20" fill="#1a1f2c" stroke="#343b4d"/>
<text x="442" y="149" class="eyebrow">VIDEO</text>
<text x="442" y="346" font-size="23" font-weight="620">Set an idea in motion</text>
<text x="442" y="377" class="muted" font-size="16">Create a short clip</text><rect x="798" y="116" width="364" height="288" rx="20" fill="#1a1f2c" stroke="#343b4d"/>
<text x="822" y="149" class="eyebrow">SPEECH</text>
<text x="822" y="346" font-size="23" font-weight="620">Give words a voice</text>
<text x="822" y="377" class="muted" font-size="16">Generate spoken audio</text><g transform="translate(96 173)">
<rect width="246" height="130" rx="13" fill="#10131b" stroke="#343b4d"/>
<circle class="sun" cx="175" cy="39" r="22" fill="#ffab72" opacity=".85"/>
<path d="m18 115 64-66 53 51 36-33 57 48Z" fill="#ffab72" opacity=".25"/>
<path d="m18 115 64-66 53 51 36-33 57 48" fill="none" stroke="#ffab72" stroke-width="2"/>
<path class="sweep" d="M1 1H245" stroke="#ffab72" stroke-width="2"/>
</g><g transform="translate(476 173)">
<rect width="246" height="130" rx="13" fill="#10131b" stroke="#343b4d"/>
<circle cx="123" cy="58" r="33" fill="#33271f"/>
<path d="m116 41 25 17-25 17Z" fill="#ffab72"/>
<path d="M24 110H222" stroke="#343b4d" stroke-width="4" stroke-linecap="round"/>
<path class="timeline" d="M24 110H222" stroke="#ffab72" stroke-width="4" stroke-linecap="round"/>
</g><g transform="translate(856 173)"><rect width="246" height="130" rx="13" fill="#10131b" stroke="#343b4d"/><rect class="wave" x="22" y="56.0" width="4" height="18" rx="2" fill="#ffab72" style="animation-delay:-0.0s"/><rect class="wave" x="32" y="50.0" width="4" height="30" rx="2" fill="#ffab72" style="animation-delay:-0.12s"/><rect class="wave" x="42" y="39.0" width="4" height="52" rx="2" fill="#ffab72" style="animation-delay:-0.24s"/><rect class="wave" x="52" y="25.0" width="4" height="80" rx="2" fill="#ffab72" style="animation-delay:-0.36s"/><rect class="wave" x="62" y="13.0" width="4" height="104" rx="2" fill="#ffab72" style="animation-delay:-0.48s"/><rect class="wave" x="72" y="29.0" width="4" height="72" rx="2" fill="#ffab72" style="animation-delay:-0.6s"/><rect class="wave" x="82" y="42.0" width="4" height="46" rx="2" fill="#ffab72" style="animation-delay:-0.72s"/><rect class="wave" x="92" y="56.0" width="4" height="18" rx="2" fill="#ffab72" style="animation-delay:-0.84s"/><rect class="wave" x="102" y="50.0" width="4" height="30" rx="2" fill="#ffab72" style="animation-delay:-0.96s"/><rect class="wave" x="112" y="39.0" width="4" height="52" rx="2" fill="#ffab72" style="animation-delay:-1.08s"/><rect class="wave" x="122" y="25.0" width="4" height="80" rx="2" fill="#ffab72" style="animation-delay:-1.2s"/><rect class="wave" x="132" y="13.0" width="4" height="104" rx="2" fill="#ffab72" style="animation-delay:-1.3199999999999998s"/><rect class="wave" x="142" y="29.0" width="4" height="72" rx="2" fill="#ffab72" style="animation-delay:-1.44s"/><rect class="wave" x="152" y="42.0" width="4" height="46" rx="2" fill="#ffab72" style="animation-delay:-1.56s"/><rect class="wave" x="162" y="56.0" width="4" height="18" rx="2" fill="#ffab72" style="animation-delay:-1.68s"/><rect class="wave" x="172" y="50.0" width="4" height="30" rx="2" fill="#ffab72" style="animation-delay:-1.7999999999999998s"/><rect class="wave" x="182" y="39.0" width="4" height="52" rx="2" fill="#ffab72" style="animation-delay:-1.92s"/><rect class="wave" x="192" y="25.0" width="4" height="80" rx="2" fill="#ffab72" style="animation-delay:-2.04s"/><rect class="wave" x="202" y="13.0" width="4" height="104" rx="2" fill="#ffab72" style="animation-delay:-2.16s"/><rect class="wave" x="212" y="29.0" width="4" height="72" rx="2" fill="#ffab72" style="animation-delay:-2.28s"/><rect class="wave" x="222" y="42.0" width="4" height="46" rx="2" fill="#ffab72" style="animation-delay:-2.4s"/></g>
<text x="38" y="437" font-size="13" class="muted">Capability illustration · Available generation options depend on your selected model and account.</text>
