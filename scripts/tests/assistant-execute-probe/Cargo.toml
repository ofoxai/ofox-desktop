[package]
name = "assistant-execute-probe"
version = "0.0.0"
edition = "2021"
publish = false

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
once_cell = "=1.21.4"
