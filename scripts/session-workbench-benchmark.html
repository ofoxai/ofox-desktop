<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>OFox renderer update benchmark</title>
    <style>
      body {
        margin: 0;
        background: rgb(var(--canvas));
        color: rgb(var(--ink));
      }
      #benchmark-controls {
        padding: 12px 16px;
        border-bottom: 1px solid rgb(var(--line));
        font: 12px/1.6 system-ui;
      }
      #benchmark-controls button,
      #benchmark-controls select {
        margin-right: 8px;
        padding: 4px 8px;
        border: 1px solid rgb(var(--line));
        border-radius: 6px;
        background: rgb(var(--card));
        color: rgb(var(--ink));
      }
      #benchmark-controls :disabled {
        opacity: 0.5;
      }
      #benchmark-surface {
        height: max(480px, calc(100vh - 190px));
        overflow: auto;
        padding: 12px;
      }
      #benchmark-results {
        overflow: auto;
        max-height: 420px;
        padding: 16px;
        font: 11px/1.5 monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./session-workbench-benchmark.tsx"></script>
  </body>
</html>
